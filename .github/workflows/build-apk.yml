name: Build tarak APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project and add app code
        run: |
          flutter create --platforms=android --org com.tarak --project-name tarak build_app
          cp lib/main.dart build_app/lib/main.dart

      - name: Add dependencies
        working-directory: build_app
        run: flutter pub add http file_picker path_provider open_filex shared_preferences  && flutter pub add file_picker:^8.1.4

      - name: Patch AndroidManifest (internet + http access, app name)
        working-directory: build_app
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' $M
          sed -i 's|android:label="[^"]*"|android:label="tarak" android:usesCleartextTraffic="true"|' $M
          cat $M

      - name: Build release APK
        working-directory: build_app
        run: flutter build apk --release

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: tarak build ${{ github.run_number }}
          files: build_app/build/app/outputs/flutter-apk/app-release.apk
